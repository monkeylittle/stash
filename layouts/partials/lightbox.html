<div class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-close" type="button" aria-label="Close">&times;</button>
  <div class="lb-strip" aria-label="Photos"></div>
  <div class="lb-stage">
    <button class="lb-nav lb-prev" type="button" aria-label="Previous photo">&#8249;</button>
    <img alt="">

  </div>
  <p class="lb-cap"></p>
</div>
