<a class="card" href="{{ .RelPermalink }}">
  {{ with partial "post-cover.html" . }}{{ partial "img.html" (dict "src" . "alt" "" "sizes" "(max-width:760px) 100vw, 360px") }}{{ end }}
  <div><time>{{ .Date.Format "2 January 2006" }}</time><h3>{{ .Title }}</h3><p>{{ .Summary | plainify }}</p></div>
</a>
