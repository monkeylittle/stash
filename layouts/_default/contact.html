{{ define "main" }}
{{ partial "page-hero.html" (dict "title" .Title "lead" .Params.lead "src" "gallery/2025_06_08_eyof_media_day_6.png" "alt" "Katie Turner at the EYOF media day" "fade" "20%") }}
<section class="wrap section split">
  <form class="form" action="{{ site.Params.formAction | safeURL }}" method="POST">
    <input type="hidden" name="_next" value="{{ "message_sent/" | absURL }}">
    <input type="hidden" name="_subject" value="New message from katieturner.ie">
    <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
    <label>Name<input name="name" required></label>
    <label>Email<input type="email" name="email" required></label>
    <label>I'm enquiring about
      <select name="topic"><option>Sponsorship</option><option>Media</option><option>Something else</option></select>
    </label>
    <label>Message<textarea name="message" rows="6" required></textarea></label>
    <button class="btn dark" type="submit">Send message</button>
  </form>
  <div>
    <h3>Elsewhere</h3>
    <p><a href="{{ site.Params.instagram }}">Instagram</a><br><a href="{{ site.Params.strava }}">Strava</a><br><a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a></p>
  </div>
</section>
{{ end }}
