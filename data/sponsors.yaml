- name: Arkwood Construction
  tier: Season partner
  logo: /img/sponsors/arkwood-construction.png
  url: "https://arkwood.ie"
  blurb: "Arkwood is a Dublin building company, established in 1995, specialising in complete home refurbishments, open plan kitchen extensions and sunrooms. They’ve built their name on quality, reliability and word of mouth, and they back me for the same reasons: hard work, commitment and a long-term view. I’m proud to have them as a season partner."
